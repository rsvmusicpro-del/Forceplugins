name: StrattPultek full validation
on:
  push:
    branches: ["feature/strattpultek"]
    paths:
      - "plugins/StrattPultek/**"
      - "framework/**"
      - "tools/**"
      - ".github/workflows/strattpultek-validation.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build native, ARM32 and ARM64; generate UI and validate
        run: python tools/build.py plugins/StrattPultek
      - name: Exercise host simulator across sample rates and block sizes
        shell: bash
        run: |
          set -euo pipefail
          plugin="plugins/StrattPultek/build/native/strattpultek.so"
          for sr in 44100 48000 96000; do
            for block in 32 128 512; do
              echo "Testing ${sr} Hz / ${block} frames"
              .sdk-tools/host_sim "$plugin" test --seconds 1 --sr "$sr" --block "$block"
            done
          done
      - name: Validate deployable MPC folder
        run: python tools/validate.py plugins/StrattPultek
      - name: Render a reference test file
        run: .sdk-tools/host_sim plugins/StrattPultek/build/native/strattpultek.so test --seconds 5 --sr 44100 --block 128 --wav plugins/StrattPultek/build/test.wav
      - name: Package installable ZIP
        run: python tools/package.py plugins/StrattPultek
      - uses: actions/upload-artifact@v4
        with:
          name: StrattPultek-MPC
          path: |
            plugins/StrattPultek/dist/*.zip
            plugins/StrattPultek/build/test.wav
          if-no-files-found: error
