name: StrattTrack validation # PR20 final-head verification
on:
  push:
    branches: ["main", "feature/stratttrack"]
    paths:
      - "plugins/StrattTrack/**"
      - "tools/test_stratttrack_contract.py"
      - "tools/test_stratttrack_cleansweep.cpp"
      - "tools/test_airwindows_console7.py"
      - "tools/test_strattpultek_filters.cpp"
      - "tools/test_strattpultek_valve.py"
      - "tools/test_stratttrack_valve.py"
      - "tools/test_stratttrack_console7_stability.cpp"
      - "tools/test_stratttrack_gain_reduction.cpp"
      - "framework/**"
      - "tools/build.py"
      - "tools/validate.py"
      - "AGENTS.md"
      - ".github/**"
      - "docs/STRATTTRACK-AI-WORKFLOW.md"
      - ".github/workflows/stratttrack.yml"
  pull_request:
    branches: ["main", "feature/stratttrack"]
    paths:
      - "plugins/StrattTrack/**"
      - "tools/test_stratttrack_contract.py"
      - "tools/test_stratttrack_cleansweep.cpp"
      - "tools/test_airwindows_console7.py"
      - "tools/test_strattpultek_filters.cpp"
      - "tools/test_strattpultek_valve.py"
      - "tools/test_stratttrack_valve.py"
      - "tools/test_stratttrack_console7_stability.cpp"
      - "plugins/StrattTrack/src/circuit_adaa.h"
      - "tools/test_stratttrack_circuit_adaa.cpp"
      - "framework/**"
      - "tools/build.py"
      - "tools/validate.py"
      - "AGENTS.md"
      - ".github/**"
      - "docs/STRATTTRACK-AI-WORKFLOW.md"
      - ".github/workflows/stratttrack.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stratttrack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-test-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static parameter and DSP contract
        run: python tools/test_stratttrack_contract.py
      - name: Verify live compressor gain-reduction telemetry
        run: |
          c++ -std=c++11 -O2 -Wall -Wextra -Werror -Iframework -Iplugins/StrattTrack/src tools/test_stratttrack_gain_reduction.cpp -o /tmp/test_stratttrack_gain_reduction
          /tmp/test_stratttrack_gain_reduction
      - name: Verify Airwindows Console7 transfer, ADAA and integration
        run: python tools/test_airwindows_console7.py
      - name: Verify Console7 stability, malformed-sample recovery and sample-rate range
        run: |
          c++ -std=c++11 -O2 -Wall -Wextra -Werror -Iframework tools/test_stratttrack_console7_stability.cpp -o /tmp/test_stratttrack_console7_stability
          /tmp/test_stratttrack_console7_stability
      - name: Verify StrattTrack Cleansweep Butterworth orders and corner response
        run: |
          c++ -std=c++11 -O2 -Wall -Wextra -Werror -Iplugins/StrattTrack/src tools/test_stratttrack_cleansweep.cpp -o /tmp/test_stratttrack_cleansweep
          /tmp/test_stratttrack_cleansweep
      - name: Verify shared valve transfer and short-interval ADAA math
        run: python tools/test_strattpultek_valve.py
      - name: Verify StrattTrack hybrid triode ADAA and antiderivative stability
        run: python tools/test_stratttrack_valve.py
      - name: Verify Drive/Circuit antiderivative ADAA and numerical stability
        run: |
          c++ -std=c++11 -O2 -Wall -Wextra -Werror -Iplugins/StrattTrack/src tools/test_stratttrack_circuit_adaa.cpp -o /tmp/test_stratttrack_circuit_adaa
          /tmp/test_stratttrack_circuit_adaa
      - name: Verify shared second-order Butterworth HP/LP response and stability
        run: |
          c++ -std=c++11 -O2 -Wall -Wextra -Werror -Iframework tools/test_strattpultek_filters.cpp -o /tmp/test_shared_filters
          /tmp/test_shared_filters
      - name: Build native, ARM32 and ARM64; generate UI and validate
        run: python tools/build.py plugins/StrattTrack
      - name: Exercise host simulator across sample rates and block sizes
        shell: bash
        run: |
          set -euo pipefail
          plugin="plugins/StrattTrack/build/native/stratttrack.so"
          for sr in 44100 48000 96000; do
            for block in 32 128 512; do
              .sdk-tools/host_sim "$plugin" test --seconds 1 --sr "$sr" --block "$block"
            done
          done
      - name: Validate deployable MPC folder
        run: python tools/validate.py plugins/StrattTrack
      - name: Render stereo reference WAV
        run: .sdk-tools/host_sim plugins/StrattTrack/build/native/stratttrack.so test --seconds 5 --sr 44100 --block 128 --wav plugins/StrattTrack/build/test.wav
      - name: Package installable ZIP
        run: python tools/package.py plugins/StrattTrack
      - uses: actions/upload-artifact@v4
        with:
          name: StrattTrack-MPC
          path: |
            plugins/StrattTrack/dist/*.zip
            plugins/StrattTrack/build/test.wav
          if-no-files-found: error
