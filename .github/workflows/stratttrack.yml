name: StrattTrack validation
on:
  push:
    branches: ["feature/stratttrack"]
    paths:
      - "plugins/StrattTrack/**"
      - "tools/test_stratttrack_contract.py"
      - "tools/test_airwindows_console7.py"
      - "framework/**"
      - "tools/build.py"
      - "tools/validate.py"
      - ".github/workflows/stratttrack.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "plugins/StrattTrack/**"
      - "tools/test_stratttrack_contract.py"
      - "framework/**"
      - "tools/build.py"
      - "tools/validate.py"
      - ".github/workflows/stratttrack.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static parameter and DSP contract
        run: python tools/test_stratttrack_contract.py
      - name: Verify Airwindows Console7 transfer, ADAA and integration
        run: python tools/test_airwindows_console7.py
      - name: Verify shared valve transfer and short-interval ADAA math
        run: python tools/test_strattpultek_valve.py
      - name: Verify shared second-order Butterworth HP/LP response and stability
        run: |
          c++ -std=c++11 -O2 -Wall -Wextra -Werror -Iframework tools/test_strattpultek_filters.cpp -o /tmp/test_shared_filters
          /tmp/test_shared_filters
      - name: Build native, ARM32 and ARM64; generate UI and validate
        run: python tools/build.py plugins/StrattTrack
      - name: Exercise host simulator across sample rates and block sizes
        shell: bash
        run: |
          set -euo pipefail
          plugin="plugins/StrattTrack/build/native/stratttrack.so"
          for sr in 44100 48000 96000; do
            for block in 32 128 512; do
              .sdk-tools/host_sim "$plugin" test --seconds 1 --sr "$sr" --block "$block"
            done
          done
      - name: Validate deployable MPC folder
        run: python tools/validate.py plugins/StrattTrack
      - name: Render stereo reference WAV
        run: .sdk-tools/host_sim plugins/StrattTrack/build/native/stratttrack.so test --seconds 5 --sr 44100 --block 128 --wav plugins/StrattTrack/build/test.wav
      - name: Package installable ZIP
        run: python tools/package.py plugins/StrattTrack
      - uses: actions/upload-artifact@v4
        with:
          name: StrattTrack-MPC
          path: |
            plugins/StrattTrack/dist/*.zip
            plugins/StrattTrack/build/test.wav
          if-no-files-found: error
